<!doctype html>
<!-- Artikel cover template. Open cover.html#perbedaan-cpns-dan-pppk | #materi-tkp-cpns | #pppk-paruh-waktu-jadi-penuh-waktu | #cpns-2027 | #rekrutmen-bersama-bumn-2026 at a 1200x630 viewport. -->
<html lang="id">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0b3a6e; font-family: "Poppins", "Inter", "Segoe UI", Arial, sans-serif; position: relative; color: #fff; }
  .glow { position: absolute; right: -180px; bottom: -260px; width: 760px; height: 760px; border-radius: 50%; background: #123f78; }
  .accent { position: absolute; right: 70px; top: 130px; width: 360px; height: 360px; background: #ffb050; border-radius: 48px 48px 48px 140px; }
  .icon { position: absolute; right: 70px; top: 130px; width: 360px; height: 360px; display: grid; place-items: center; }
  .icon svg { width: 190px; height: 190px; stroke: #0b3a6e; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .logo { position: absolute; left: 56px; top: 48px; background: #fff; border-radius: 16px; padding: 10px 20px; }
  .logo img { display: block; height: 52px; width: auto; }
  .text { position: absolute; left: 56px; bottom: 90px; width: 700px; }
  h1 { font-size: 84px; line-height: 1.05; font-weight: 800; letter-spacing: -1px; }
  p { margin-top: 22px; font-size: 34px; font-weight: 500; color: #ffb050; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="accent"></div>
  <div class="icon" id="icon"></div>
  <div class="logo"><img src="logo-akademi-asn-footer.webp" alt="Akademi ASN"></div>
  <div class="text"><h1 id="label"></h1><p id="tagline"></p></div>
<script>
  const svg = (d) => `<svg viewBox="0 0 24 24">${d}</svg>`;
  const covers = {
    "perbedaan-cpns-dan-pppk": ["Perbedaan CPNS dan PPPK", "Status, masa kerja, syarat, dan pensiun", svg('<path d="M12 3v18M7 21h10M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>')],
    "materi-tkp-cpns": ["Materi TKP CPNS", "6 aspek dan sistem penilaiannya", svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/>')],
    "pppk-paruh-waktu-jadi-penuh-waktu": ["PPPK Paruh Waktu", "Jalur jadi PPPK penuh waktu", svg('<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>')],
    "cpns-2027": ["CPNS 2027", "Jadwal pendaftaran dan syarat pelamar", svg('<path d="M8 2v4M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/>')],
    "rekrutmen-bersama-bumn-2026": ["Rekrutmen BUMN 2026", "Status pendaftaran dan cara bersiap", svg('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>')],
  };
  const [label, tagline, icon] = covers[location.hash.slice(1)];
  document.getElementById("label").textContent = label;
  document.getElementById("tagline").textContent = tagline;
  document.getElementById("icon").innerHTML = icon;
</script>
</body>
</html>
