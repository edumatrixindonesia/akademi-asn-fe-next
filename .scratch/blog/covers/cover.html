<!doctype html>
<!-- Default Kategori cover template. Open cover.html#cpns | #pppk | #bumn | #tips-info at a 1200x630 viewport. -->
<html lang="id">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0b3a6e; font-family: "Poppins", "Inter", "Segoe UI", Arial, sans-serif; position: relative; color: #fff; }
  .glow { position: absolute; right: -180px; bottom: -260px; width: 760px; height: 760px; border-radius: 50%; background: #123f78; }
  .accent { position: absolute; right: 70px; top: 130px; width: 360px; height: 360px; background: #ffb050; border-radius: 48px 48px 48px 140px; }
  .icon { position: absolute; right: 70px; top: 130px; width: 360px; height: 360px; display: grid; place-items: center; }
  .icon svg { width: 190px; height: 190px; stroke: #0b3a6e; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .logo { position: absolute; left: 56px; top: 48px; background: #fff; border-radius: 16px; padding: 10px 20px; }
  .logo img { display: block; height: 52px; width: auto; }
  .text { position: absolute; left: 56px; bottom: 90px; width: 700px; }
  h1 { font-size: 84px; line-height: 1.05; font-weight: 800; letter-spacing: -1px; }
  p { margin-top: 22px; font-size: 34px; font-weight: 500; color: #ffb050; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="accent"></div>
  <div class="icon" id="icon"></div>
  <div class="logo"><img src="logo-akademi-asn-footer.webp" alt="Akademi ASN"></div>
  <div class="text"><h1 id="label"></h1><p id="tagline"></p></div>
<script>
  const svg = (d) => `<svg viewBox="0 0 24 24">${d}</svg>`;
  const covers = {
    cpns: ["Artikel CPNS", "Info & tips seleksi CPNS", svg('<path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6"/>')],
    pppk: ["Artikel PPPK", "Info & tips seleksi PPPK", svg('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>')],
    bumn: ["Artikel BUMN", "Info & tips Rekrutmen Bersama BUMN", svg('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>')],
    "tips-info": ["Tips & Info", "Seleksi CPNS, PPPK, dan BUMN", svg('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>')],
  };
  const [label, tagline, icon] = covers[location.hash.slice(1)] ?? covers.cpns;
  document.getElementById("label").textContent = label;
  document.getElementById("tagline").textContent = tagline;
  document.getElementById("icon").innerHTML = icon;
</script>
</body>
</html>
